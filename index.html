
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Website đầu tiên của tôi</title>

    <style>
        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            color: #1769aa;
            font-size: 36px;
        }

        p {
            color: #333333;
            font-size: 20px;
        }

        button {
            background-color: #1769aa;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b4778;
        }
    </style>
</head>

<body>
    <h1>Xin chào! 👋</h1>

    <p>Đây là website đầu tiên của tôi.</p>

    <button onclick="alert('Ngu Đần Hiếu!')">
        Nhấn vào đây
    </button>
</body>
</html>
